<!DOCTYPE html>
<html>
<head>
    <title>Rocket Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
    <div id="simulation">
        <div id="stats">
        Altitude: <span id="altitude">0</span> m<br>
        Velocity: <span id="velocity">0</span> m/s<br>
        Time: <span id="time">0</span> s
        </div>
    </div>
    <div id="options">
        <h1>Configure Simulation</h1>
        <h2>Planet Data</h2>
        <div>
            <label for="planetMass">Planet Mass (kg):</label>
            <br>
            <input type="number" id="planetMass" value="5.972e24" step="any">
        </div>
        <div>
            <label for="planetRadius">Planet Radius (km):</label>
            <br>
            <input type="number" id="planetRadius" value="6378" step="any">
        </div>
        <div>
            <label for="atmosphereThickness">Atmosphere Thickness (km):</label>
            <br>
            <input type="number" id="atmosphereThickness" value="100" step="any">
        </div>
        <div>
            <label for="airDensity">Air Density (kg/m^3):</label>
            <br>
            <input type="number" id="airDensity" value="1.225" step="any">
        </div>
        <div>
            <label for="scaleHeight">Scale Height (km) [where the air density is 1/e times as dense compared to the surface]:</label>
            <br>
            <input type="number" id="scaleHeight" value="8.5" step="any">
        </div>
        <h2>Rocket Data</h2>
        <div style="margin-bottom: 20px; font-weight: bold;">
            <label><input type="radio" name="stageMode" id="modeSingle" checked> Single Stage</label>
            <label style="margin-left: 15px;"><input type="radio" name="stageMode" id="modeMulti"> Multi Stage</label>
        </div>
        <div id="singleStageInputs">
            <label>Rocket Radius (m): <input type="number" id="rocketRadius" value="0.1764" step="any"></label><br>
            <label>Dry Mass (kg) [excluding fuel]: <input type="number" id="rocketMass" value="10" step="any"></label><br>
            <label>Fuel Mass (kg): <input type="number" id="fuelMass" value="8" step="any"></label><br>
            <label>Burn Rate (kg/sec): <input type="number" id="fuelConsumptionRate" value="0.8" step="any"></label><br>
            <label>Thrust Force (N): <input type="number" id="thrustForce" value="500" step="any"></label><br>
        </div>
        <div id="multiStageInputs" style="display: none">
            <h3>Stage 1 (Bottom)</h3>
            <div>
                <label>Stage Radius (m): <input type="number" id="s1_radius" value="15" step="any"></label><br>
                <label>Dry Mass (kg) [excluding fuel]: <input type="number" id="s1_mass" value="15" step="any"></label><br>
                <label>Fuel Mass (kg): <input type="number" id="s1_fuel" value="40" step="any"></label><br>
                <label>Burn Rate (kg/s): <input type="number" id="s1_burn" value="2.0" step="any"></label><br>
                <label>Thrust Force (N): <input type="number" id="s1_thrust" value="1500" step="any"></label>
            </div>
            <h3>Stage 2</h3>
            <div>
                <label>Stage Radius (m): <input type="number" id="s2_radius" value="15" step="any"></label><br>
                <label>Dry Mass (kg) [excluding fuel]: <input type="number" id="s2_mass" value="15" step="any"></label><br>
                <label>Fuel Mass (kg): <input type="number" id="s2_fuel" value="40" step="any"></label><br>
                <label>Burn Rate (kg/s): <input type="number" id="s2_burn" value="2.0" step="any"></label><br>
                <label>Thrust Force (N): <input type="number" id="s2_thrust" value="1500" step="any"></label>
            </div>
            <h3>Stage 3 (top)</h3>
            <div>
                <label>Stage Radius (m): <input type="number" id="s3_radius" value="15" step="any"></label><br>
                <label>Dry Mass (kg) [excluding fuel]: <input type="number" id="s3_mass" value="15" step="any"></label><br>
                <label>Fuel Mass (kg): <input type="number" id="s3_fuel" value="40" step="any"></label><br>
                <label>Burn Rate (kg/s): <input type="number" id="s3_burn" value="2.0" step="any"></label><br>
                <label>Thrust Force (N): <input type="number" id="s3_thrust" value="1500" step="any"></label>
            </div>
        </div>
        <br><br>
        <button id="startButton">Start Simulation</button>
        <br><br>
        <button id="resetButton">Reset Simulation</button>

    </div>
    </div>
    <script type="module" src="scripts.js"></script>
</body>
</html>
